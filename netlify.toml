[build]
  command   = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish   = "."

[dev]
  command = "python app.py"
  port    = 5000

[[redirects]]
  from   = "/analyze"
  to     = "/.netlify/functions/analyze"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/app"
  status = 200
